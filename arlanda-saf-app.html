_PER_YEAR = 31_536_000\nEARTH_AREA_M2 = 5.1e14\nQAEI_EFFICACY = 0.42\nQAEI_AGWP_FACTOR = 8.8e-14  # W m^-2 yr per kg CO2 basis used by QAEI Tutorial 3\n\n\ndef k100_t_per_joule() -> float:\n    \"\"\"QAEI 100-year conversion, t CO2e per joule of contrail energy forcing.\n\n    k100 = 0.42 / (5.1e14 * 31_536_000 * 8.8e-14 * 1000)\n    \"\"\"\n    return QAEI_EFFICACY / (EARTH_AREA_M2 * SECONDS_PER_YEAR * QAEI_AGWP_FACTOR * 1000)\n\n\nK100 = k100_t_per_joule()  # ~2.967e-13 t CO2e / J  (~0.297 t per TJ)\n\n\n@dataclass\nclass FuelParams:\n    rho_J: float = 800.0        # kg/m3 Jet A-1 (illustrative assumption)\n    rho_S: float = 760.0        # kg/m3 HEFA-SPK (illustrative assumption)\n    H_J: float = 43.0           # MJ/kg (illustrative assumption)\n    H_S: float = 44.0           # MJ/kg (illustrative assumption)\n    CI_J: float = 89.0          # g CO2e/MJ (Boeing Cascade conventional default)\n    CI_S: float = 13.9          # g CO2e/MJ (ICAO CORSIA UCO-HEFA default, sensitivity)\n    price_J_eur_t: float = 640.0    # EASA 2025 EU reference\n    price_S_eur_t: float = 1925.0   # EASA 2025 EU aviation biofuel reference\n    hefa_a2_max_vol: float = 0.50   # ICAO HEFA-SPK Annex A2 limit, volume basis\n    k_contrail: float = field(default_factory=k100_t_per_joule)\n\n\n# ---------------------------------------------------------------------------\n# Blend basis conversions\n# ---------------------------------------------------------------------------\ndef mass_to_volume_fraction(w_u: float, rho_S: float, rho_J: float) -> float:\n    \"\"\"b = (w/rho_S) / (w/rho_S + (1-w)/rho_J).\"\"\"\n    if not 0.0 <= w_u <= 1.0:\n        raise ValueError(\"mass fraction must lie in [0, 1]\")\n    if w_u == 0.0:\n        return 0.0\n    return (w_u / rho_S) / (w_u / rho_S + (1.0 - w_u) / rho_J)\n\n\ndef volume_to_mass_fraction(b: float, rho_S: float, rho_J: float) -> float:\n    \"\"\"w = b*rho_S / (b*rho_S + (1-b)*rho_J).\"\"\"\n    if not 0.0 <= b <= 1.0:\n        raise ValueError(\"volume fraction must lie in [0, 1]\")\n    if b == 0.0:\n        return 0.0\n    return b * rho_S / (b * rho_S + (1.0 - b) * rho_J)\n\n\ndef blend_density(w_u: float, rho_S: float, rho_J: float) -> float:\n    \"\"\"Density of the finished blend, kg/m3 (ideal mixing by volume).\"\"\"\n    return 1.0 / (w_u / rho_S + (1.0 - w_u) / rho_J)\n\n\n@dataclass(frozen=True)\nclass Grade:\n    \"\"\"A named fuel grade. `fraction` is interpreted on `basis`.\"\"\"\n    name: str\n    fraction: float\n    basis: str = \"mass\"          # \"mass\" or \"volume\"\n    dedicated_delivery: bool = False\n    label: str = \"\"\n\n    def mass_fraction(self, fp: FuelParams) -> float:\n        if self.basis == \"mass\":\n            return float(self.fraction)\n        if self.basis == \"volume\":\n            return volume_to_mass_fraction(self.fraction, fp.rho_S, fp.rho_J)\n        raise ValueError(f\"unknown basis {self.basis!r}\")\n\n    def volume_fraction(self, fp: FuelParams) -> float:\n        if self.basis == \"volume\":\n            return float(self.fraction)\n        return mass_to_volume_fraction(self.fraction, fp.rho_S, fp.rho_J)\n\n    def spec_compliant(self, fp: FuelParams) -> bool:\n        \"\"\"Annex A2 HEFA-SPK limit applied on a volume basis.\n\n        This only screens the nominal blend ratio; it never certifies a batch.\n        \"\"\"\n        return self.volume_fraction(fp) <= fp.hefa_a2_max_vol + 1e-12\n\n\nREFERENCE = Grade(\"reference_Jet_A1\", 0.0, \"mass\", False, \"Declared reference Jet A-1 (0% SAF assumed)\")\nHEFA_35 = Grade(\"HEFA_35wt\", 0.35, \"mass\", True, \"HEFA-SPK/Jet A-1, 35% SAF by mass\")\n\n\n# ---------------------------------------------------------------------------\n# Tank mixing and burn\n# ---------------------------------------------------------------------------\n@dataclass\nclass BurnResult:\n    U_kg: float\n    q_SAF_kg: float          # pure SAF in the new delivery\n    q_stock_kg: float        # pure SAF charged to the segregated stock\n    w_onboard: float         # mixed onboard SAF mass fraction\n    H_mix: float             # MJ/kg\n    m_burn_kg: float\n    m_S_kg: float\n    m_J_kg: float\n    remaining_kg: float\n    L_fuel_t: float          # life-cycle t CO2e\n\n\ndef burn(route_energy_MJ: float, U_kg: float, w_u: float, fp: FuelParams,\n         M0_kg: float = 0.0, w0: float = 0.0, dedicated: bool = True) -> BurnResult:\n    \"\"\"Well-mixed tank: deliver U kg at w_u onto M0 kg at w0 and burn route energy.\"\"\"\n    if U_kg < 0 or M0_kg < 0:\n        raise ValueError(\"fuel masses must be non-negative\")\n    q_SAF = U_kg * w_u\n    q_stock = q_SAF if dedicated else 0.0\n    total = M0_kg + U_kg\n    w_on = (M0_kg * w0 + U_kg * w_u) / total if total > 0 else 0.0\n    H_mix = (1.0 - w_on) * fp.H_J + w_on * fp.H_S\n    m_burn = route_energy_MJ / H_mix\n    m_S = w_on * m_burn\n    m_J = (1.0 - w_on) * m_burn\n    L_fuel = (m_J * fp.H_J * fp.CI_J + m_S * fp.H_S * fp.CI_S) / 1_000_000\n    return BurnResult(U_kg, q_SAF, q_stock, w_on, H_mix, m_burn, m_S, m_J,\n                      total - m_burn, L_fuel)\n\n\ndef contrail_score_t(EF_J: float, fp: FuelParams) -> float:\n    \"\"\"L_contrail = k100 * EF (signed). Positive EF warms, negative cools.\"\"\"\n    return fp.k_contrail * EF_J\n\n\ndef blended_EF(EF_ordinary: float, w_onboard: float, response_scale: float,\n               rel_change_at_ref: float = -0.15, w_ref: float = 0.35) -> float:\n    \"\"\"Teaching surrogate: EF = EF_ordinary + response_scale * delta_EF_for_blend.\n\n    delta_EF_for_blend = rel_change_at_ref * (w_onboard / w_ref) * EF_ordinary.\n    Zero for ordinary fuel; at response_scale = 0 SAF has no contrail effect.\n    Because it scales EF_ordinary, a *cooling* contrail is weakened as well,\n    which can worsen the score. This coefficient is NOT derived from the\n    CFM56 11% simulation or the 42% taxi nvPM statistic.\n    \"\"\"\n    if w_onboard <= 0:\n        return EF_ordinary\n    delta = rel_change_at_ref * (w_onboard / w_ref) * EF_ordinary\n    return EF_ordinary + response_scale * delta\n\n\ndef breakeven_EF_J(extra_fuel_kg: float, fp: FuelParams, H: float | None = None,\n                   CI: float | None = None) -> float:\n    \"\"\"EF (J) a detour must avoid to pay back its extra fossil fuel.\"\"\"\n    H = fp.H_J if H is None else H\n    CI = fp.CI_J if CI is None else CI\n    extra_t = extra_fuel_kg * H * CI / 1_000_000\n    return extra_t / fp.k_contrail\n\n\n# ---------------------------------------------------------------------------\n# Economics\n# ---------------------------------------------------------------------------\n@dataclass\nclass CostResult:\n    cash_eur: float          # purchase cash for the uplift + fee\n    comparison_eur: float    # burned fuel valued by component + fee (inventory-neutral)\n    premium_eur: float       # SAF price premium on the pure SAF uplift + fee\n\n\ndef costs(br: BurnResult, w_u: float, fp: FuelParams, fee_eur: float = 0.0) -> CostResult:\n    U = br.U_kg\n    cash = (U * (1 - w_u) * fp.price_J_eur_t + U * w_u * fp.price_S_eur_t) / 1000 + fee_eur\n    comparison = (br.m_J_kg * fp.price_J_eur_t + br.m_S_kg * fp.price_S_eur_t) / 1000 + fee_eur\n    premium = U * w_u * (fp.price_S_eur_t - fp.price_J_eur_t) / 1000 + fee_eur\n    return CostResult(cash, comparison, premium)\n\n\ndef eur_per_t_saved(extra_eur: float, saving_t: float) -> float | None:\n    \"\"\"Abatement cost, reported only for strictly positive climate savings.\"\"\"\n    if saving_t is None or saving_t <= 1e-12:\n        return None\n    return extra_eur / saving_t\n\n\n# ---------------------------------------------------------------------------\n# Contrail formation screen (Schmidt–Appleman, Schumann 1996 approximation)\n# ---------------------------------------------------------------------------\ndef sac_threshold_K(p_hPa: float, EI_H2O: float = 1.23, Q_J_kg: float = 43.2e6,\n                    eta: float = 0.38) -> float:\n    \"\"\"Approximate threshold temperature (K) for contrail formation at liquid saturation.\"\"\"\n    cp, eps = 1004.0, 0.622\n    G = EI_H2O * cp * (p_hPa * 100.0) / (eps * Q_J_kg * (1.0 - eta))  # Pa/K\n    x = math.log(G - 0.053)\n    return 273.15 - 46.46 + 9.43 * x + 0.72 * x * x\n\n\ndef solar_elevation_deg(lat: float, lon: float, when_utc) -> float:\n    \"\"\"Approximate solar elevation (NOAA low-precision formula).\"\"\"\n    doy = when_utc.timetuple().tm_yday\n    hour = when_utc.hour + when_utc.minute / 60 + when_utc.second / 3600\n    g = 2 * math.pi / 365 * (doy - 1 + (hour - 12) / 24)\n    decl = (0.006918 - 0.399912 * math.cos(g) + 0.070257 * math.sin(g)\n            - 0.006758 * math.cos(2 * g) + 0.000907 * math.sin(2 * g)\n            - 0.002697 * math.cos(3 * g) + 0.00148 * math.sin(3 * g))\n    eqt = 229.18 * (0.000075 + 0.001868 * math.cos(g) - 0.032077 * math.sin(g)\n                    - 0.014615 * math.cos(2 * g) - 0.040849 * math.sin(2 * g))\n    tst = hour * 60 + eqt + 4 * lon\n    ha = math.radians(tst / 4 - 180)\n    la = math.radians(lat)\n    cz = math.sin(la) * math.sin(decl) + math.cos(la) * math.cos(decl) * math.cos(ha)\n    return math.degrees(math.asin(max(-1.0, min(1.0, cz))))\n\n\ndef haversine_km(lat1, lon1, lat2, lon2) -> float:\n    R = 6371.0\n    p1, p2 = math.radians(lat1), math.radians(lat2)\n    dp, dl = p2 - p1, math.radians(lon2 - lon1)\n    a = math.sin(dp / 2) ** 2 + math.cos(p1) * math.cos(p2) * math.sin(dl / 2) ** 2\n    return 2 * R * math.asin(math.sqrt(a))\n", "saf_app/presets.py": "\"\"\"Preset registry and helpers that keep editable tables consistent.\"\"\"\nfrom __future__ import annotations\n\nimport copy\n\nimport numpy as np\nimport pandas as pd\n\nfrom .stockholm import (DEFAULT_SCENARIOS, ROUTES, Case, build_sourced_options, load_tracks,\n                        sourced_case, synthetic_case, to_min)\n\nPRESETS = {\n    \"Sourced cohort (12 ARN departures, 17 Nov 2026)\": \"sourced\",\n    \"Illustrative Stockholm simulation (12 synthetic rows)\": \"synthetic\",\n    \"Small teaching fixture (4 synthetic rows)\": \"small\",\n}\n\n\ndef make_preset(key: str) -> Case:\n    kind = PRESETS.get(key, key)\n    if kind == \"sourced\":\n        return sourced_case()\n    c = synthetic_case()\n    if kind == \"small\":\n        keep = [\"SYN-01\", \"SYN-03\", \"SYN-08\", \"SYN-12\"]\n        c.flights = c.flights[c.flights.study_id.isin(keep)].reset_index(drop=True)\n        c.manifest = c.manifest[c.manifest.study_id.isin(keep)].reset_index(drop=True)\n        c.options = c.options[c.options.study_id.isin(keep)].reset_index(drop=True)\n        c.supply[\"opening_stock_kg\"] = 2600.0\n        c.supply[\"receipt_kg\"] = 0.0\n        c.name = \"Small teaching fixture\"\n    return c\n\n\nFLIGHT_DEFAULTS = {\n    \"modelled_aircraft\": \"Airbus A320-251N\", \"modelled_engine\": \"2 × CFM LEAP-1A26\",\n    \"track_distance_km\": 600.0, \"peak_alt_ft\": 37000.0, \"cruise_km_available\": 200.0,\n    \"trip_fuel_kg\": 2190.0, \"taxi_kg\": 200.0, \"reserve_kg\": 2000.0, \"uplift_kg\": 4500.0,\n    \"M0_kg\": 0.0, \"w0\": 0.0, \"tank_capacity_kg\": 18700.0, \"lower_allowed\": True,\n    \"higher_allowed\": True, \"lower_penalty_pct\": 1.8, \"higher_penalty_pct\": 0.3,\n    \"level_changes\": 2, \"mass_for_level_change_kg\": 65000.0, \"eligible_for_saf\": True,\n    \"energy_source\": \"assumption (row added in app)\", \"destination\": \"CPH\", \"flight_number\": \"\",\n}\n\n\ndef sanitize_flights(df: pd.DataFrame, case: Case) -> pd.DataFrame:\n    df = df.copy().reset_index(drop=True)\n    for k, v in FLIGHT_DEFAULTS.items():\n        if k not in df:\n            df[k] = v\n        df[k] = df[k].where(df[k].notna(), v) if df[k].dtype != bool else df[k].fillna(v)\n    used = set()\n    for i in range(len(df)):\n        sid = df.at[i, \"study_id\"]\n        if not isinstance(sid, str) or not sid.strip() or sid in used:\n            k = 1\n            while f\"SYN-{k:02d}\" in used or f\"SYN-{k:02d}\" in set(df.study_id.dropna()):\n                k += 1\n            df.at[i, \"study_id\"] = f\"SYN-{k:02d}\"\n        used.add(df.at[i, \"study_id\"])\n        std = df.at[i, \"std_utc\"] if \"std_utc\" in df else None\n        if not isinstance(std, str) or not std:\n            df.at[i, \"std_utc\"] = \"2026-11-17T12:00:00Z\"\n        if \"route_cutoff_min\" not in df or pd.isna(df.at[i, \"route_cutoff_min\"]):\n            df.at[i, \"route_cutoff_min\"] = to_min(df.at[i, \"std_utc\"]) - case.settings[\"route_cutoff_min_before_std\"]\n    for b in (\"lower_allowed\", \"higher_allowed\", \"eligible_for_saf\"):\n        df[b] = df[b].astype(bool)\n    return df\n\n\ndef ensure_options(case: Case, rebuild_surrogate: bool = False) -> None:\n    \"\"\"Make sure every (flight, route, scenario) has an EF row; rebuild sourced screen if asked.\"\"\"\n    if case.kind == \"sourced\" and rebuild_surrogate:\n        _, fc = load_tracks()\n        new = build_sourced_options(case.flights, case.scenarios, fc, case.settings)\n        old = case.options\n        keep = old[old.ef_source.isin([\"team estimate\", \"edited in app\"])]\n        if len(keep):\n            new = new.set_index([\"study_id\", \"route\", \"scenario\"])\n            k = keep.set_index([\"study_id\", \"route\", \"scenario\"])\n            common = new.index.intersection(k.index)\n            new.loc[common, [\"EF_ordinary_J\", \"ef_source\"]] = k.loc[common, [\"EF_ordinary_J\", \"ef_source\"]]\n            new = new.reset_index()\n        case.options = new\n        return\n    idx = pd.MultiIndex.from_product([case.flights.study_id, ROUTES, case.scenarios.scenario],\n                                     names=[\"study_id\", \"route\", \"scenario\"])\n    o = case.options.drop_duplicates([\"study_id\", \"route\", \"scenario\"]).set_index([\"study_id\", \"route\", \"scenario\"])\n    o = o.reindex(idx)\n    o[\"EF_ordinary_J\"] = o[\"EF_ordinary_J\"].fillna(0.0)\n    o[\"ef_source\"] = o[\"ef_source\"].fillna(\"assumed zero (no estimate entered)\")\n    case.options = o.reset_index()\n\n\ndef ef_wide(case: Case) -> pd.DataFrame:\n    w = case.options.pivot_table(index=[\"study_id\", \"route\"], columns=\"scenario\", values=\"EF_ordinary_J\",\n                                 aggfunc=\"first\").reindex(columns=list(case.scenarios.scenario))\n    return (w / 1e12).reset_index()\n\n\ndef apply_ef_wide(case: Case, wide: pd.DataFrame) -> None:\n    long = wide.melt(id_vars=[\"study_id\", \"route\"], var_name=\"scenario\", value_name=\"EF_TJ\")\n    long[\"EF_ordinary_J\"] = long.EF_TJ.astype(float).fillna(0.0) * 1e12\n    o = case.options.set_index([\"study_id\", \"route\", \"scenario\"])\n    for _, r in long.iterrows():\n        key = (r.study_id, r.route, r.scenario)\n        if key in o.index and not np.isclose(o.at[key, \"EF_ordinary_J\"], r.EF_ordinary_J, rtol=1e-9, atol=1e3):\n            o.at[key, \"EF_ordinary_J\"] = r.EF_ordinary_J\n            o.at[key, \"ef_source\"] = \"edited in app\"\n    case.options = o.reset_index()\n\n\ndef clone(case: Case) -> Case:\n    return copy.deepcopy(case)\n", "saf_app/runner.py": "\"\"\"One complete optimisation run: build, solve, evaluate, tabulate, export.\n\nThe UI only ever displays numbers that come out of `run_case`.\n\"\"\"\nfrom __future__ import annotations\n\nimport hashlib\nimport io\nimport json\nfrom dataclasses import dataclass\n\nimport numpy as np\nimport pandas as pd\n\nfrom .evaluation import HeldOut, paired_summary, sample_heldout, strongest_comparator\nfrom .model import Problem\nfrom .stockholm import Case, build_problem\nfrom .strategies import REFERENCE_NAME, STRATEGY_NAMES, StrategyResult, run_all\n\n\ndef case_fingerprint(case: Case) -> str:\n    payload = {\n        \"flights\": case.flights.to_json(), \"scen\": case.scenarios.to_json(),\n        \"opts\": case.options.to_json(), \"supply\": case.supply, \"settings\": case.settings,\n        \"fuel\": case.fuel.__dict__, \"kind\": case.kind,\n    }\n    return hashlib.sha256(json.dumps(payload, sort_keys=True, default=str).encode()).hexdigest()[:12]\n\n\n@dataclass\nclass Run:\n    case_name: str\n    kind: str\n    label: str\n    fingerprint: str\n    P: Problem\n    detail: pd.DataFrame\n    results: dict\n    heldout: HeldOut\n    paired: pd.DataFrame\n    strongest: str\n    summary: pd.DataFrame\n    scenario_table: pd.DataFrame\n    allocation: pd.DataFrame\n\n\ndef strategy_summary(P: Problem, results: dict[str, StrategyResult], benchmark: str,\n                     ho: HeldOut) -> pd.DataFrame:\n    rows = []\n    ref = results[REFERENCE_NAME]\n    bench = results.get(benchmark, ref)\n    for name in STRATEGY_NAMES + [REFERENCE_NAME]:\n        r = results[name]\n        f, c, e = r.components(P)\n        rows.append({\n            \"strategy\": name,\n            \"departures_included\": len(P.flights),\n            \"fuel_lifecycle_tCO2e\": f, \"contrail_tCO2e\": c, \"extra_tCO2e\": e,\n            \"expected_score_tCO2e\": r.expected,\n            \"heldout_mean_tCO2e\": float(ho.scores[name].mean()),\n            \"pure_SAF_from_stock_kg\": r.saf_stock_kg(P),\n            \"pure_SAF_burned_kg\": r.saf_burn_kg(P),\n            \"SAF_flights\": int((r.x > 0).sum()),\n            \"cash_paid_eur\": r.cash_eur(P),\n            \"comparison_cost_eur\": r.comparison_eur(P),\n            \"extra_cost_vs_ordinary_eur\": r.comparison_eur(P) - ref.comparison_eur(P),\n            \"saf_premium_cash_eur\": r.premium_eur(P),\n            \"diff_vs_benchmark_tCO2e\": r.expected - bench.expected,\n        })\n    df = pd.DataFrame(rows)\n    saved = df.expected_score_tCO2e.iloc[-1] - df.expected_score_tCO2e\n    df[\"climate_saving_vs_ordinary_tCO2e\"] = saved\n    df[\"eur_per_t_saved\"] = [(x / s) if s > 1e-9 else np.nan\n                             for x, s in zip(df.extra_cost_vs_ordinary_eur, saved)]\n    return df\n\n\ndef allocation_table(P: Problem, res: StrategyResult, detail: pd.DataFrame, case: Case) -> pd.DataFrame:\n    n, B, R, S = P.shape\n    fl = case.flights.reset_index(drop=True)\n    vis = P.meta.get(\"visibility\")\n    rows = []\n    for i in range(n):\n        b = int(res.x[i])\n        d = detail[(detail.study_id == P.flights[i]) & (detail.grade == P.grades[b])]\n        d0 = d[d.route == \"reference\"].iloc[0]\n        routes = {}\n        for s in range(S):\n            routes[P.scenarios[s]] = P.routes[res.route[i, s]]\n        exp_score = float(P.p @ res.per_flight[i])\n        rows.append({\n            \"study_id\": P.flights[i], \"flight\": fl.loc[i, \"flight_number\"], \"to\": fl.loc[i, \"destination\"],\n            \"STD_UTC\": pd.Timestamp(fl.loc[i, \"std_utc\"]).strftime(\"%H:%M\"),\n            \"fuel\": \"SAF blend\" if b > 0 else \"Reference Jet A-1\",\n            \"grade\": P.grades[b],\n            \"blend_mass_pct\": 100 * d0.saf_mass_frac_delivered,\n            \"blend_vol_pct\": 100 * d0.saf_vol_frac_delivered,\n            \"uplift_kg\": d0.uplift_kg,\n            \"pure_SAF_stock_kg\": float(P.q_stock[i, b]),\n            \"truck_loads\": int(P.truck_loads[i, b]),\n            **{f\"route | {k}\": v for k, v in routes.items()},\n            \"signal_groups\": \"/\".join(str(g) for g in P.groups[i]),\n            \"update_visible\": bool(vis.iloc[i].has_update) if vis is not None else True,\n            \"expected_score_tCO2e\": exp_score,\n        })\n    return pd.DataFrame(rows)\n\n\ndef run_case(case: Case) -> Run:\n    P, detail = build_problem(case)\n    st = case.settings\n    results = run_all(P, st[\"contrail_weight\"], st.get(\"cvar_weight\", 0.0))\n    ho = sample_heldout(P, results, int(st[\"heldout_seed\"]), int(st[\"heldout_draws\"]),\n                        float(st[\"heldout_sigma\"]))\n    paired = paired_summary(ho)\n    strongest = strongest_comparator(results)\n    summ = strategy_summary(P, results, st.get(\"benchmark\", \"Original-route targeting\"), ho)\n    sc_rows = []\n    for name, r in results.items():\n        for s, sn in enumerate(P.scenarios):\n            sc_rows.append({\"strategy\": name, \"scenario\": sn, \"probability\": P.p[s],\n                            \"fleet_score_tCO2e\": r.scenario_scores[s]})\n    alloc = allocation_table(P, results[\"Joint stochastic\"], detail, case)\n    return Run(case.name, case.kind, case.run_label, case_fingerprint(case), P, detail, results, ho,\n               paired, strongest, summ, pd.DataFrame(sc_rows), alloc)\n\n\ndef export_csv(run: Run, case: Case) -> str:\n    \"\"\"CSV with units, strategy, seeds and assumptions; matches the dashboard table.\"\"\"\n    buf = io.StringIO()\n    st = case.settings\n    hdr = [\n        f\"# run_label,{run.label}\",\n        f\"# data_kind,{'SYNTHETIC - illustrative, not historical' if run.kind == 'synthetic' else 'sourced cohort with modelled decisions'}\",\n        f\"# fingerprint,{run.fingerprint}\",\n        f\"# departures_included,{len(run.P.flights)}\",\n        f\"# climate_basis,t CO2e QAEI 100-year; k100={case.fuel.k_contrail:.6e} t/J\",\n        f\"# planning_evaluation,exact expectation over scenario table (planning seed {st['planning_seed']}; no sampling)\",\n        f\"# heldout_seed,{run.heldout.seed}\",\n        f\"# heldout_method,{run.heldout.method}\",\n        f\"# info_mode,{st['info_mode']}\",\n        f\"# saf_contrail_response_scale,{st['response_scale']}\",\n        f\"# opening_stock_kg,{case.supply['opening_stock_kg']}\",\n        f\"# prices,EASA 2025 EU reference: Jet {case.fuel.price_J_eur_t} EUR/t; biofuel {case.fuel.price_S_eur_t} EUR/t\",\n        f\"# CI,Jet {case.fuel.CI_J} g/MJ; SAF {case.fuel.CI_S} g/MJ (UCO-HEFA sensitivity value)\",\n    ]\n    buf.write(\"\\n\".join(hdr) + \"\\n\")\n    run.summary.to_csv(buf, index=False, float_format=\"%.6g\")\n    return buf.getvalue()\n", "saf_app/solver.py": "\"\"\"Two-stage mixed-integer allocation solver (SciPy HiGHS via scipy.optimize.milp).\n\nminimise   sum_s p[s] * sum_{i,b,r} C[i,b,r,s] * y[i,b,r,g_i(s)]\nsubject to sum_b x[i,b] = 1                                   each flight\n           sum_r y[i,b,r,g] = x[i,b]                          each flight, grade, signal\n           y[i,b,r,g_i(s)] <= a[i,b,r,s]                      each supported outcome\n           cumulative q_stock * x by service time <= opening stock + receipts\n           truck loads overlapping a service window <= window capacity\n           number of dedicated deliveries <= max_special\n           sum premium * x <= cash cap                        (optional)\n           x[i,b] = 0 for ineligible grades\n\nOptional CVaR term (Rockafellar–Uryasev): + lambda * (eta + 1/alpha * sum_s p_s u_s),\nu_s >= Z_s - eta, u_s >= 0, which handles fractional probability at the alpha boundary.\n\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\n\nimport numpy as np\nfrom scipy.optimize import Bounds, LinearConstraint, milp\nfrom scipy.sparse import lil_matrix\n\nfrom .model import Problem\n\n\nclass SolveError(RuntimeError):\n    pass\n\n\n@dataclass\nclass Solution:\n    status: int\n    message: str\n    x: np.ndarray                # (n,) chosen grade index per flight\n    route: np.ndarray            # (n,S) chosen route index per flight & outcome\n    objective_opt: float         # optimiser objective (weight applied, no tie terms)\n    expected_score: float        # physically reported (weight 1) expected score\n    scenario_scores: np.ndarray  # (S,) fleet score per outcome (weight 1)\n    binding: dict = field(default_factory=dict)\n    cvar: float | None = None\n\n\ndef _tie_scale(C: np.ndarray) -> float:\n    m = np.nanmean(np.abs(C)) if C.size else 1.0\n    return max(m, 1e-9) * 1e-7\n\n\ndef _route_policy(P: Problem, x: np.ndarray, C_opt: np.ndarray):\n    \"\"\"Best feasible route per signal group for a fixed fuel commitment.\n\n    Tie rule: lowest route index (planned profile first).\n    Returns route[i,s] or raises SolveError if no feasible recourse exists.\n    \"\"\"\n    n, B, R, S = P.shape\n    route = np.zeros((n, S), dtype=int)\n    for i in range(n):\n        b = int(x[i])\n        for g in np.unique(P.groups[i]):\n            ss = np.where(P.groups[i] == g)[0]\n            best, best_r = None, None\n            for r in range(R):\n                if not P.feasible[i, b, r, ss].all():\n                    continue\n                val = float((P.p[ss] * C_opt[i, b, r, ss]).sum())\n                if best is None or val < best - 1e-12:\n                    best, best_r = val, r\n            if best_r is None:\n                raise SolveError(f\"No feasible route for {P.flights[i]} with {P.grades[b]} \"\n                                 f\"in signal group {g}.\")\n            route[i, ss] = best_r\n    return route\n\n\ndef evaluate_commitment(P: Problem, x: np.ndarray, contrail_weight: float = 1.0):\n    \"\"\"Exact expected score of a fixed first-stage plan with adaptive recourse.\n\n    Route policy is chosen with the optimiser weight; the reported score uses weight 1.\n    \"\"\"\n    C_opt = P.score(contrail_weight)\n    C = P.score(1.0)\n    route = _route_policy(P, x, C_opt)\n    n, B, R, S = P.shape\n    per = np.zeros((n, S))\n    for i in range(n):\n        per[i] = C[i, int(x[i]), route[i], np.arange(S)]\n    scen = per.sum(axis=0)\n    return route, per, scen, float(P.p @ scen)\n\n\ndef resource_check(P: Problem, x: np.ndarray) -> list[str]:\n    \"\"\"Return a list of violated first-stage limits for commitment x (empty = ok).\"\"\"\n    n, B, R, S = P.shape\n    out = []\n    xb = np.zeros((n, B))\n    xb[np.arange(n), x.astype(int)] = 1\n    if np.any(xb * ~P.grade_allowed):\n        for i in range(n):\n            if not P.grade_allowed[i, int(x[i])]:\n                out.append(f\"{P.flights[i]}: grade {P.grades[int(x[i])]} not eligible \"\n                           f\"({P.grade_reason.get((i, int(x[i])), 'ineligible')})\")\n    used = (P.q_stock * xb).sum(axis=1)\n    for k, t in enumerate(sorted(set(P.service_start_min.tolist()))):\n        cap = P.opening_stock_kg + sum(kg for (tt, kg) in P.receipts if tt <= t)\n        tot = used[P.service_start_min <= t].sum()\n        if tot > cap + 1e-6:\n            out.append(f\"Cumulative SAF stock exceeded by t={t:.0f} min ({tot:.0f} > {cap:.0f} kg)\")\n            break\n    loads = (P.truck_loads * xb * P.dedicated[None, :]).sum(axis=1)\n    for w in P.slot_windows:\n        ov = (P.service_start_min < w.end_min) & (P.service_end_min > w.start_min)\n        if loads[ov].sum() > w.capacity + 1e-9:\n            out.append(f\"Truck slots exceeded in window {w.label or (w.start_min, w.end_min)}\")\n    if P.max_special is not None:\n        k = int((xb * P.dedicated[None, :]).sum())\n        if k > P.max_special:\n            out.append(f\"Dedicated refuellings {k} > maximum {P.max_special}\")\n    if P.cash_cap_eur is not None:\n        spend = float((P.premium_eur * xb).sum())\n        if spend > P.cash_cap_eur + 1e-6:\n            out.append(f\"Cash premium €{spend:,.0f} > cap €{P.cash_cap_eur:,.0f}\")\n    return out\n\n\ndef solve(P: Problem, *, contrail_weight: float = 1.0, scenario_subset: list[int] | None = None,\n          x_values: np.ndarray | None = None, forced: dict | None = None,\n          cvar_weight: float = 0.0, cvar_alpha: float = 0.05,\n          time_limit: float = 60.0) -> Solution:\n    \"\"\"Solve the fuel-and-route MILP.\n\n    scenario_subset : optimise against only these outcomes (renormalised), used by\n                      the joint-deterministic method; groups become 'revealed'.\n    x_values        : (n,B) objective on x only (targeting rules). Routes are still\n                      required to be feasible for every supported outcome.\n    forced          : {flight_index: grade_index} fixes x for explanation re-solves.\n    \"\"\"\n    n, B, R, S_all = P.shape\n    scen = list(range(S_all)) if scenario_subset is None else list(scenario_subset)\n    p = P.p[scen] / P.p[scen].sum()\n    groups = P.groups[:, scen].copy()\n    if scenario_subset is not None:\n        groups = np.tile(np.arange(len(scen)), (n, 1))\n    S = len(scen)\n    C_opt = P.score(contrail_weight)[:, :, :, scen]\n    feas = P.feasible[:, :, :, scen]\n    tie = _tie_scale(C_opt)\n\n    # ---- variable indexing\n    xi = {(i, b): i * B + b for i in range(n) for b in range(B)}\n    nv = n * B\n    yi = {}\n    gl = [np.unique(groups[i]) for i in range(n)]\n    for i in range(n):\n        for b in range(B):\n            for r in range(R):\n                for g in gl[i]:\n                    yi[(i, b, r, int(g))] = nv\n                    nv += 1\n    use_cvar = cvar_weight > 0\n    if use_cvar:\n        eta_idx = nv\n        u_idx = {s: nv + 1 + s for s in range(S)}\n        nv += 1 + S\n\n    c = np.zeros(nv)\n    lb, ub = np.zeros(nv), np.ones(nv)\n    integrality = np.ones(nv)\n    for (i, b), k in xi.items():\n        if not P.grade_allowed[i, b]:\n            ub[k] = 0\n        if forced is not None and i in forced:\n            lb[k] = ub[k] = 1.0 if b == forced[i] else 0.0\n        if x_values is not None:\n            c[k] += x_values[i, b]\n        # tie rule: prefer less SAF, then earlier flights keep ordinary fuel\n        c[k] += tie * (P.q_stock[i, b] / (P.q_stock.max() + 1e-9)) * (1 + i / (10 * n))\n    for (i, b, r, g), k in yi.items():\n        ss = np.where(groups[i] == g)[0]\n        if not feas[i, b, r, ss].all():\n            ub[k] = 0\n        if x_values is None:\n            c[k] += float((p[ss] * C_opt[i, b, r, ss]).sum())\n        c[k] += tie * 0.1 * r  # tie rule: planned profile first\n    if use_cvar:\n        lb[eta_idx], ub[eta_idx] = -np.inf, np.inf\n        integrality[eta_idx] = 0\n        c[eta_idx] += cvar_weight\n        for s, k in u_idx.items():\n            ub[k] = np.inf\n            integrality[k] = 0\n            c[k] += cvar_weight * p[s] / cvar_alpha\n\n    rows, lo, hi = [], [], []\n    A = lil_matrix((0, nv))\n\n    def add(coefs: dict, l, h):\n        rows.append(coefs)\n        lo.append(l)\n        hi.append(h)\n\n    for i in range(n):\n        add({xi[(i, b)]: 1.0 for b in range(B)}, 1, 1)\n        for b in range(B):\n            for g in gl[i]:\n                d = {yi[(i, b, r, int(g))]: 1.0 for r in range(R)}\n                d[xi[(i, b)]] = -1.0\n                add(d, 0, 0)\n    # cumulative stock\n    stock_rows = []\n    for t in sorted(set(P.service_start_min.tolist())):\n        cap = P.opening_stock_kg + sum(kg for (tt, kg) in P.receipts if tt <= t)\n        if not np.isfinite(cap):\n            continue\n        d = {}\n        for i in np.where(P.service_start_min <= t)[0]:\n            for b in range(B):\n                if P.q_stock[i, b] > 0:\n                    d[xi[(i, b)]] = float(P.q_stock[i, b])\n        if d:\n            stock_rows.append((len(rows), f\"SAF stock available by t={t:.0f} min\", cap))\n            add(d, -np.inf, cap)\n    slot_rows = []\n    for w in P.slot_windows:\n        ov = (P.service_start_min < w.end_min) & (P.service_end_min > w.start_min)\n        d = {}\n        for i in np.where(ov)[0]:\n            for b in range(B):\n                if P.dedicated[b] and P.truck_loads[i, b] > 0:\n                    d[xi[(i, b)]] = float(P.truck_loads[i, b])\n        if d:\n            slot_rows.append((len(rows), f\"Truck slots {w.label}\", w.capacity))\n            add(d, -np.inf, w.capacity)\n    special_row = None\n    if P.max_special is not None:\n        d = {xi[(i, b)]: 1.0 for i in range(n) for b in range(B) if P.dedicated[b]}\n        if d:\n            special_row = (len(rows), \"Maximum dedicated refuellings\", P.max_special)\n            add(d, -np.inf, P.max_special)\n    cash_row = None\n    if P.cash_cap_eur is not None:\n        d = {xi[(i, b)]: float(P.premium_eur[i, b]) for i in range(n) for b in range(B)\n             if P.premium_eur[i, b] != 0}\n        if d:\n            cash_row = (len(rows), \"Cash cap on SAF premium\", P.cash_cap_eur)\n            add(d, -np.inf, P.cash_cap_eur)\n    if use_cvar:\n        for s in range(S):\n            d = {u_idx[s]: 1.0, eta_idx: 1.0}\n            for i in range(n):\n                g = int(groups[i, s])\n                for b in range(B):\n                    for r in range(R):\n                        d[yi[(i, b, r, g)]] = d.get(yi[(i, b, r, g)], 0) - float(C_opt[i, b, r, s])\n            add(d, 0, np.inf)\n\n    A = lil_matrix((len(rows), nv))\n    for k, d in enumerate(rows):\n        for j, v in d.items():\n            A[k, j] = v\n    cons = LinearConstraint(A.tocsr(), np.array(lo), np.array(hi)) if rows else None\n    res = milp(c, constraints=cons, integrality=integrality, bounds=Bounds(lb, ub),\n               options={\"time_limit\": time_limit, \"mip_rel_gap\": 1e-9})\n    if res.status != 0 or res.x is None:\n        raise SolveError(f\"Solver status {res.status}: {res.message}. \"\n                         \"No plan is displayed because the problem is infeasible or unsolved.\")\n    z = res.x\n    x = np.array([int(np.argmax([z[xi[(i, b)]] for b in range(B)])) for i in range(n)])\n\n    # Recover routes on the full outcome set with the true information structure.\n    route, per, scen_scores, exp = evaluate_commitment(P, x, contrail_weight)\n    C_opt_full = P.score(contrail_weight)\n    obj_opt = float(sum(P.p[s] * C_opt_full[i, x[i], route[i, s], s]\n                        for i in range(n) for s in range(S_all)))\n    if scenario_subset is not None:\n        # objective that the deterministic planner believed in\n        obj_opt = float(sum(p[k] * C_opt_full[i, x[i], route[i, s], s]\n                            for k, s in enumerate(scen) for i in range(n)))\n    binding = {}\n    act = A.tocsr() @ z\n    for lst in (stock_rows, slot_rows):\n        for (k, label, cap) in lst:\n            binding[label] = {\"used\": float(act[k]), \"limit\": float(cap),\n                              \"binding\": bool(act[k] >= cap - 1e-6)}\n    for item in (special_row, cash_row):\n        if item:\n            k, label, cap = item\n            binding[label] = {\"used\": float(act[k]), \"limit\": float(cap),\n                              \"binding\": bool(act[k] >= cap - 1e-6)}\n    cvar_val = None\n    if use_cvar:\n        cvar_val = cvar(scen_scores, P.p, cvar_alpha)\n    return Solution(res.status, res.message, x, route, obj_opt, exp, scen_scores, binding, cvar_val)\n\n\ndef cvar(values: np.ndarray, p: np.ndarray, alpha: float = 0.05) -> float:\n    \"\"\"Probability-weighted mean of the worst alpha tail (higher = worse).\n\n    Handles a fractional probability at the alpha boundary exactly.\n    \"\"\"\n    order = np.argsort(-values)\n    rem, acc = alpha, 0.0\n    for k in order:\n        take = min(p[k], rem)\n        acc += take * values[k]\n        rem -= take\n        if rem <= 1e-15:\n            break\n    return acc / alpha\n\n\ndef enumerate_best(P: Problem, contrail_weight: float = 1.0):\n    \"\"\"Exhaustive enumeration over first-stage plans (small problems only).\"\"\"\n    import itertools\n    n, B, R, S = P.shape\n    best = None\n    for combo in itertools.product(range(B), repeat=n):\n        x = np.array(combo)\n        if resource_check(P, x):\n            continue\n        try:\n            route, per, scen, exp = evaluate_commitment(P, x, contrail_weight)\n        except SolveError:\n            continue\n        val = float(P.p @ P.score(contrail_weight)[np.arange(n)[:, None], x[:, None], route,\n                                                   np.arange(S)[None, :]].sum(axis=0))\n        if best is None or val < best[0] - 1e-12:\n            best = (val, x, exp)\n    return best\n", "saf_app/stockholm.py": "\"\"\"Stockholm Arlanda case: data loading, presets and Problem construction.\n\nTwo presets:\n  * \"Sourced cohort\" – the 12 documented ARN departures in data/arlanda. Rows,\n    times and tracks are sourced; energy, uplift, supply and EF are modelled\n    or assumed and labelled as such.\n  * \"Illustrative Stockholm simulation\" – 12 synthetic rows (SYN-xx) with a\n    hand-built EF table, kept out of historical counts and exports.\n\"\"\"\nfrom __future__ import annotations\n\nimport copy\nimport math\nfrom dataclasses import dataclass, field\nfrom pathlib import Path\n\nimport numpy as np\nimport pandas as pd\n\nfrom . import physics as ph\nfrom .evidence import annotate_manifest\nfrom .model import InputError, Problem, SlotWindow, info_groups\n\nDATA = Path(__file__).resolve().parent.parent / \"data\" / \"arlanda\"\nT0 = pd.Timestamp(\"2026-11-17T00:00:00Z\")\nROUTES = [\"reference\", \"lower\", \"higher\"]\nROUTE_LABEL = {\"reference\": \"Planned profile\", \"lower\": \"2,000 ft lower\", \"higher\": \"2,000 ft higher\"}\nA320NEO_CEILING_FT = 39_800\n\n\ndef to_min(ts) -> float:\n    if ts is None or (isinstance(ts, float) and math.isnan(ts)) or ts == \"\":\n        return float(\"nan\")\n    return (pd.Timestamp(ts).tz_convert(\"UTC\") - T0).total_seconds() / 60.0\n\n\ndef from_min(m: float) -> str:\n    return (T0 + pd.Timedelta(minutes=float(m))).strftime(\"%d %b %H:%M UTC\")\n\n\ndef isa_pressure_hpa(alt_ft: float) -> float:\n    h = alt_ft * 0.3048\n    if h <= 11000:\n        return 1013.25 * (1 - 2.25577e-5 * h) ** 5.25588\n    return 226.32 * math.exp(-(h - 11000) / 6341.62)\n\n\n# ---------------------------------------------------------------------------\n@dataclass\nclass Case:\n    name: str\n    kind: str                     # \"sourced\" | \"synthetic\"\n    manifest: pd.DataFrame        # annotated historical (or synthetic) rows\n    flights: pd.DataFrame         # editable modelling inputs, one row per departure\n    scenarios: pd.DataFrame       # scenario, probability, rhi_multiplier, partial_pool\n    options: pd.DataFrame         # long table: study_id, route, scenario, EF_ordinary_J, ...\n    supply: dict\n    settings: dict\n    fuel: ph.FuelParams = field(default_factory=ph.FuelParams)\n    notes: list = field(default_factory=list)\n\n    @property\n    def run_label(self) -> str:\n        if self.kind == \"sourced\":\n            n_team = int((self.options.get(\"ef_source\", pd.Series(dtype=str)) == \"team estimate\").sum())\n            tag = \"team EF estimates\" if n_team else \"teaching-surrogate EF\"\n            return f\"Sourced cohort · modelled decisions ({tag}; energy, uplift and supply assumed)\"\n        return \"Illustrative Stockholm simulation · synthetic rows, not historical\"\n\n\n# ---------------------------------------------------------------------------\n# Defaults\n# ---------------------------------------------------------------------------\nDEFAULT_SUPPLY = {\n    \"opening_stock_kg\": 4400.0,          # ~2 trial-size truckloads of neat SAF (assumption)\n    \"receipt_time_utc\": \"2026-11-17T12:00:00Z\",\n    \"receipt_kg\": 2200.0,\n    \"truck_capacity_L\": 8000.0,          # Quante et al. trial truck (observation, not a 2026 fact)\n    \"trucks_per_window\": 2,\n    \"window_minutes\": 60,\n    \"service_minutes\": 35,\n    \"service_offset_min\": 60,            # special refuelling starts this long before STD\n    \"booking_lead_h\": 6.0,               # supplier must be booked this long before service\n    \"max_special\": 6,\n    \"fee_eur\": 250.0,\n    \"cash_cap_enabled\": False,\n    \"cash_cap_eur\": 15000.0,\n}\n\nDEFAULT_SETTINGS = {\n    \"fuel_deadline_utc\": \"2026-11-16T22:00:00Z\",   # after the 16 Nov 18Z cycle was published\n    \"planning_cycle\": \"2026-11-16T18:00:00Z\",\n    \"route_cutoff_min_before_std\": 90,\n    \"info_mode\": \"partial_update\",\n    \"response_scale\": 1.0,\n    \"rel_change_at_ref\": -0.15,\n    \"contrail_weight\": 1.0,\n    \"detour_energy_scale\": 1.0,\n    \"cvar_weight\": 0.0,\n    \"ef_lw_J_per_km\": 1.0e11,\n    \"ef_sw_J_per_km\": 6.0e11,\n    \"heldout_seed\": 20261117,\n    \"heldout_draws\": 2000,\n    \"heldout_sigma\": 0.35,\n    \"planning_seed\": 0,\n    \"benchmark\": \"Original-route targeting\",\n    \"blend_sensitivity\": False,\n    \"sens_fraction\": 0.40,\n    \"sens_basis\": \"volume\",\n    \"contrail_horizon\": \"100-year\",\n}\n\nDEFAULT_SCENARIOS = pd.DataFrame({\n    \"scenario\": [\"dry\", \"moderate ISS\", \"high ISS\"],\n    \"probability\": [0.40, 0.35, 0.25],\n    \"rhi_multiplier\": [0.90, 1.00, 1.25],\n    \"pooled_in_partial\": [False, True, True],\n    \"description\": [\"Forecast humidity 10% too high\", \"Forecast as issued\",\n                    \"Forecast misses thin ice-supersaturated layers (+25% RHi)\"],\n})\n\n\n# ---------------------------------------------------------------------------\n# Sourced cohort\n# ---------------------------------------------------------------------------\ndef load_manifest(path: Path | None = None) -> pd.DataFrame:\n    path = path or DATA / \"flight_manifest.csv\"\n    if not Path(path).exists():\n        return pd.DataFrame()\n    return pd.read_csv(path)\n\n\n_CACHE: dict = {}\n\n\ndef load_tracks():\n    if \"tracks\" not in _CACHE:\n        summ = pd.read_csv(DATA / \"tracks\" / \"summary.csv\")\n        fc = pd.read_csv(DATA / \"tracks\" / \"forecast_at_observed_waypoints.csv\")\n        _CACHE[\"tracks\"] = (summ, fc)\n    return _CACHE[\"tracks\"]\n\n\ndef contrail_screen_cached(study_id, cycle, route, rhi_mult, lw, sw):\n    key = (\"screen\", study_id, cycle, route, round(float(rhi_mult), 6), float(lw), float(sw))\n    if key not in _CACHE:\n        _, fc = load_tracks()\n        _CACHE[key] = contrail_screen(fc, study_id, cycle, route, rhi_mult, lw, sw)\n    return _CACHE[key]\n\n\ndef _default_flight_inputs(man: pd.DataFrame, summ: pd.DataFrame) -> pd.DataFrame:\n    rows = []\n    s = summ.set_index(\"study_id\")\n    for _, m in man.iterrows():\n        sid = m.study_id\n        dist = float(s.loc[sid, \"sampled_airborne_distance_km\"]) if sid in s.index else float(m.great_circle_km)\n        peak = float(s.loc[sid, \"max_reported_altitude_ft\"]) if sid in s.index else 37000.0\n        trip = 600.0 + 2.65 * dist     # kg ordinary fuel, linear A20N proxy (assumption)\n        reserve = 2000.0\n        taxi = 200.0\n        contingency = 0.05 * trip\n        uplift = math.ceil((trip + contingency + reserve + taxi) / 10.0) * 10.0\n        cruise_km = dist - 400.0\n        alt_ok = cruise_km >= 150.0\n        hi_ok = alt_ok and peak + 2000 <= A320NEO_CEILING_FT\n        std = to_min(m.scheduled_departure_utc)\n        rows.append({\n            \"study_id\": sid, \"flight_number\": m.flight_number, \"destination\": m.destination_iata,\n            \"std_utc\": m.scheduled_departure_utc,\n            \"modelled_aircraft\": \"Airbus A320-251N\", \"modelled_engine\": \"2 × CFM LEAP-1A26\",\n            \"track_distance_km\": round(dist, 1), \"peak_alt_ft\": peak,\n            \"cruise_km_available\": round(cruise_km, 1),\n            \"trip_fuel_kg\": round(trip, 0), \"taxi_kg\": taxi, \"reserve_kg\": reserve,\n            \"uplift_kg\": uplift, \"M0_kg\": 0.0, \"w0\": 0.0, \"tank_capacity_kg\": 18_700.0,\n            \"lower_allowed\": alt_ok, \"higher_allowed\": hi_ok,\n            \"lower_penalty_pct\": 1.8, \"higher_penalty_pct\": 0.3,\n            \"level_changes\": 2, \"mass_for_level_change_kg\": 65_000.0,\n            \"route_cutoff_min\": std - DEFAULT_SETTINGS[\"route_cutoff_min_before_std\"],\n            \"eligible_for_saf\": True,\n            \"energy_source\": \"assumption: linear A20N burn proxy × 43 MJ/kg\",\n        })\n    return pd.DataFrame(rows)\n\n\ndef level_reason(f: pd.Series, route: str) -> str:\n    if route == \"reference\":\n        return \"\"\n    if f.cruise_km_available < 150:\n        return f\"short leg: {f.cruise_km_available:.0f} km of cruise after climb/descent (< 150 km)\"\n    if route == \"higher\" and f.peak_alt_ft + 2000 > A320NEO_CEILING_FT:\n        return f\"{f.peak_alt_ft + 2000:,.0f} ft exceeds A320neo ceiling {A320NEO_CEILING_FT:,} ft\"\n    return \"disabled by user\"\n\n\ndef contrail_screen(fc: pd.DataFrame, study_id: str, cycle: str, route: str,\n                    rhi_mult: float, lw: float, sw: float):\n    \"\"\"Persistent-contrail screen along the observed track at one level.\n\n    Persistent if RHi × multiplier ≥ 100% and T below the Schmidt–Appleman\n    threshold. Returns (contrail_km, signed EF in J, detail DataFrame).\n    The EF per km is a *teaching surrogate*: longwave warming minus a shortwave\n    term proportional to sin(solar elevation).\n    \"\"\"\n    d = fc[(fc.study_id == study_id) & (fc.source_forecast_init_utc == cycle)].copy()\n    if d.empty:\n        d = fc[fc.study_id == study_id].copy()\n        if d.empty:\n            return 0.0, 0.0, d\n        first = sorted(d.source_forecast_init_utc.unique())[0]\n        d = d[d.source_forecast_init_utc == first].copy()\n    d = d.sort_values(\"waypoint_utc\").reset_index(drop=True)\n    off = {\"reference\": 0, \"lower\": -2000, \"higher\": 2000}[route]\n    tcol = {\"reference\": \"temperature_K\", \"lower\": \"temperature_K_lower_2000ft\",\n            \"higher\": \"temperature_K_higher_2000ft\"}[route]\n    rcol = {\"reference\": \"relative_humidity_over_ice_pct\", \"lower\": \"relative_humidity_over_ice_pct_lower_2000ft\",\n            \"higher\": \"relative_humidity_over_ice_pct_higher_2000ft\"}[route]\n    lat, lon = d.latitude_deg.to_numpy(), d.longitude_deg.to_numpy()\n    seg = np.zeros(len(d))\n    for k in range(len(d) - 1):\n        seg[k] = ph.haversine_km(lat[k], lon[k], lat[k + 1], lon[k + 1])\n    if len(d) > 1:\n        seg[-1] = np.median(seg[:-1])\n    alt = d.assumed_pressure_altitude_ft.to_numpy() + off\n    T = d[tcol].to_numpy(dtype=float)\n    rhi = d[rcol].to_numpy(dtype=float) * rhi_mult\n    tsac = np.array([ph.sac_threshold_K(isa_pressure_hpa(a)) for a in alt])\n    persistent = np.nan_to_num(rhi) >= 100.0\n    persistent &= np.nan_to_num(T, nan=999) < tsac\n    when = pd.to_datetime(d.waypoint_utc, utc=True)\n    elev = np.array([ph.solar_elevation_deg(la, lo, w.to_pydatetime()) for la, lo, w in zip(lat, lon, when)])\n    ef_km = lw - sw * np.clip(np.sin(np.radians(elev)), 0, None)\n    ef = float((seg * ef_km * persistent).sum())\n    d = d.assign(segment_km=seg, rhi_scaled=rhi, T_sac_K=tsac, persistent=persistent,\n                 solar_elev_deg=elev, ef_J=seg * ef_km * persistent, level_ft=alt)\n    return float((seg * persistent).sum()), ef, d\n\n\ndef build_sourced_options(flights: pd.DataFrame, scenarios: pd.DataFrame, fc: pd.DataFrame,\n                          settings: dict) -> pd.DataFrame:\n    rows = []\n    for _, f in flights.iterrows():\n        for route in ROUTES:\n            for _, sc in scenarios.iterrows():\n                km, ef, _ = contrail_screen_cached(f.study_id, settings[\"planning_cycle\"], route,\n                                            float(sc.rhi_multiplier), settings[\"ef_lw_J_per_km\"],\n                                            settings[\"ef_sw_J_per_km\"])\n                rows.append({\"study_id\": f.study_id, \"route\": route, \"scenario\": sc.scenario,\n                             \"contrail_km\": round(km, 1), \"EF_ordinary_J\": ef,\n                             \"ef_source\": \"teaching surrogate (GFS screen)\",\n                             \"forecast_issue_utc\": settings[\"planning_cycle\"]})\n    return pd.DataFrame(rows)\n\n\ndef apply_team_estimates(options: pd.DataFrame, flights: pd.DataFrame, team: pd.DataFrame) -> tuple:\n    \"\"\"Merge a filled option_scenario_inputs CSV. Rows with values override the surrogate.\n\n    Only ordinary-fuel rows set EF_ordinary_J; route_energy_MJ overrides energy.\n    Returns (options, flights, n_rows_used).\n    \"\"\"\n    opts = options.copy()\n    fl = flights.copy()\n    used = 0\n    t = team.dropna(subset=[\"EF_contrail_j\"], how=\"all\") if \"EF_contrail_j\" in team else team.iloc[0:0]\n    for _, r in t.iterrows():\n        if str(r.get(\"fuel_option\", \"\")).startswith(\"reference\") and pd.notna(r.get(\"EF_contrail_j\")):\n            m = (opts.study_id == r.study_id) & (opts.route == r.route_option) & (opts.scenario == r.weather_scenario_id)\n            if m.any():\n                opts.loc[m, \"EF_ordinary_J\"] = float(r.EF_contrail_j)\n                opts.loc[m, \"ef_source\"] = \"team estimate\"\n                opts.loc[m, \"forecast_issue_utc\"] = r.get(\"forecast_issue_utc\", \"\")\n                used += 1\n    return opts, fl, used\n\n\ndef sourced_case() -> Case:\n    man_raw = load_manifest()\n    if man_raw.empty:\n        c = synthetic_case()\n        c.notes.append(\"12 proposed departures · manifest pending — showing the illustrative simulation.\")\n        return c\n    man, notes = annotate_manifest(man_raw)\n    summ, fc = load_tracks()\n    flights = _default_flight_inputs(man, summ)\n    scen = DEFAULT_SCENARIOS.copy()\n    settings = copy.deepcopy(DEFAULT_SETTINGS)\n    options = build_sourced_options(flights, scen, fc, settings)\n    return Case(\"Sourced cohort\", \"sourced\", man, flights, scen, options,\n                copy.deepcopy(DEFAULT_SUPPLY), settings, ph.FuelParams(), notes)\n\n\n# ---------------------------------------------------------------------------\n# Synthetic preset\n# ---------------------------------------------------------------------------\n# EF_ordinary in units of 3 TJ for (reference, lower, higher) × (dry, moderate, high).\n# None = level unavailable.\n_SYN = [\n    # id, dest, dist_km, std, EF table, note\n    (\"SYN-01\", \"CPH\", 600, \"05:00\", [[0, 2, 9], [0, 0, 1], [0, 1, 4]], \"warming at night; cheap lower detour\"),\n    (\"SYN-02\", \"OSL\", 420, \"05:40\", [[0, 2, 10], None, None], \"short leg: planned profile only, humid-sensitive\"),\n    (\"SYN-03\", \"LHR\", 1650, \"06:10\", [[0, 18, 40], [0, 2, 6], [0, 8, 22]], \"cheap detour, large avoided EF\"),\n    (\"SYN-04\", \"CDG\", 1600, \"07:40\", [[1, 10, 24], [0, 9, 22], [0, 2, 5]], \"expensive higher detour helps\"),\n    (\"SYN-05\", \"BER\", 880, \"07:45\", [[0, 4, 12], [0, 3, 11], None], \"modest benefit, at ceiling\"),\n    (\"SYN-06\", \"OSL\", 430, \"08:05\", [[0, 0, 0], None, None], \"never forms persistent contrails\"),\n    (\"SYN-07\", \"CPH\", 590, \"10:50\", [[0, 3, 6], [0, 2, 5], [0, 0, 1]], \"expensive detour, small EF\"),\n    (\"SYN-08\", \"LHR\", 1640, \"11:10\", [[0, -6, -14], [0, -1, -3], [0, -4, -9]], \"midday cooling case\"),\n    (\"SYN-09\", \"CPH\", 595, \"15:05\", [[0, 6, 15], [0, 1, 3], [0, 5, 13]], \"dusk warming\"),\n    (\"SYN-10\", \"LHR\", 1570, \"15:20\", [[0, 14, 30], [0, 12, 28], [0, 1, 4]], \"high-humidity sensitive\"),\n    (\"SYN-11\", \"CDG\", 1630, \"16:55\", [[0, 9, 26], [0, 3, 8], [0, 8, 24]], \"night warming\"),\n    (\"SYN-12\", \"OSL\", 430, \"19:45\", [[0, 3, 12], None, None], \"short leg: planned profile only, night warming\"),\n]\n\n\ndef synthetic_case() -> Case:\n    rows, opts, man = [], [], []\n    scen = DEFAULT_SCENARIOS.copy()\n    scen[\"rhi_multiplier\"] = np.nan  # EF table is entered directly\n    for sid, dest, dist, std, table, note in _SYN:\n        std_utc = f\"2026-11-17T{std}:00Z\"\n        trip = 600.0 + 2.65 * dist\n        uplift = math.ceil((trip * 1.05 + 2200) / 10) * 10\n        lower_ok = table[1] is not None\n        higher_ok = table[2] is not None\n        rows.append({\n            \"study_id\": sid, \"flight_number\": \"\", \"destination\": dest, \"std_utc\": std_utc,\n            \"modelled_aircraft\": \"Airbus A320-251N\", \"modelled_engine\": \"2 × CFM LEAP-1A26\",\n            \"track_distance_km\": float(dist), \"peak_alt_ft\": 37000.0 if higher_ok else 39000.0,\n            \"cruise_km_available\": float(dist - 400),\n            \"trip_fuel_kg\": round(trip), \"taxi_kg\": 200.0, \"reserve_kg\": 2000.0,\n            \"uplift_kg\": uplift, \"M0_kg\": 0.0, \"w0\": 0.0, \"tank_capacity_kg\": 18_700.0,\n            \"lower_allowed\": lower_ok, \"higher_allowed\": higher_ok,\n            \"lower_penalty_pct\": 0.6 if sid == \"SYN-03\" else 1.8,\n            \"higher_penalty_pct\": 4.0 if sid in (\"SYN-04\", \"SYN-07\") else 0.3,\n            \"level_changes\": 2, \"mass_for_level_change_kg\": 65_000.0,\n            \"route_cutoff_min\": to_min(std_utc) - 90, \"eligible_for_saf\": True,\n            \"energy_source\": \"illustrative assumption\",\n        })\n        man.append({\"study_id\": sid, \"flight_number\": \"\", \"origin_iata\": \"ARN\", \"destination_iata\": dest,\n                    \"scheduled_departure_utc\": std_utc, \"is_synthetic\": True,\n                    \"flight_status\": \"synthetic\", \"aircraft_status\": \"synthetic\",\n                    \"engine_status\": \"synthetic\", \"operator_status\": \"synthetic\",\n                    \"conflict\": \"\", \"documented\": False, \"audit_note\": note})\n        for r, route in enumerate(ROUTES):\n            for s, sc in enumerate(scen.scenario):\n                ef = 3.0 * table[r][s] * 1e12 if table[r] is not None else 0.0\n                opts.append({\"study_id\": sid, \"route\": route, \"scenario\": sc,\n                             \"contrail_km\": np.nan, \"EF_ordinary_J\": ef,\n                             \"ef_source\": \"synthetic teaching table\", \"forecast_issue_utc\": \"\"})\n    settings = copy.deepcopy(DEFAULT_SETTINGS)\n    settings[\"rel_change_at_ref\"] = -0.30  # illustrative, synthetic preset only\n    return Case(\"Illustrative Stockholm simulation\", \"synthetic\", pd.DataFrame(man), pd.DataFrame(rows),\n                scen, pd.DataFrame(opts), copy.deepcopy(DEFAULT_SUPPLY), settings, ph.FuelParams(),\n                [\"Synthetic rows use internal IDs only and are excluded from historical counts and exports.\"])\n\n\n# ---------------------------------------------------------------------------\n# Forecast information per flight\n# ---------------------------------------------------------------------------\ndef update_visibility(flights: pd.DataFrame, settings: dict) -> pd.DataFrame:\n    \"\"\"Which GFS cycle each flight's dispatcher can see at its route cutoff.\n\n    A flight whose cutoff precedes publication of any cycle newer than the\n    fuel-deadline cycle sees *no update* regardless of the global mode.\n    \"\"\"\n    try:\n        wi = pd.read_csv(DATA / \"weather_index.csv\")\n        wi = wi[wi.role == \"archived forecast\"]\n        cyc = wi.groupby(\"forecast_init_utc\").provider_index_modified_utc.max().reset_index()\n        cyc[\"avail_min\"] = cyc.provider_index_modified_utc.map(to_min)\n    except Exception:\n        cyc = pd.DataFrame({\"forecast_init_utc\": [], \"avail_min\": []})\n    plan_min = to_min(settings[\"planning_cycle\"])\n    out = []\n    for _, f in flights.iterrows():\n        cut = float(f.route_cutoff_min)\n        seen = cyc[cyc.avail_min <= cut]\n        latest = seen.forecast_init_utc.max() if len(seen) else \"\"\n        newer = bool(latest) and to_min(latest) > plan_min\n        out.append({\"study_id\": f.study_id, \"route_cutoff\": from_min(cut),\n                    \"latest_cycle_visible\": latest or \"none\", \"has_update\": newer})\n    return pd.DataFrame(out)\n\n\n# ---------------------------------------------------------------------------\n# Build the optimisation Problem\n# ---------------------------------------------------------------------------\ndef grade_list(case: Case) -> list[ph.Grade]:\n    g = [ph.REFERENCE, ph.HEFA_35]\n    s = case.settings\n    if s.get(\"blend_sensitivity\"):\n        g.append(ph.Grade(f\"Sensitivity_{s['sens_fraction']:.0%}_{s['sens_basis']}\", float(s[\"sens_fraction\"]),\n                          s[\"sens_basis\"], True, \"Blend sensitivity (not the main case)\"))\n    return g\n\n\ndef route_energy_MJ(f: pd.Series, route: str, fp: ph.FuelParams, scale: float = 1.0) -> float:\n    base = float(f.trip_fuel_kg) * fp.H_J\n    if route == \"reference\":\n        return base\n    pct = float(f.lower_penalty_pct if route == \"lower\" else f.higher_penalty_pct) / 100.0\n    cruise_frac = max(0.0, min(1.0, float(f.cruise_km_available) / max(float(f.track_distance_km), 1.0)))\n    level = float(f.level_changes) * float(f.mass_for_level_change_kg) * 9.81 * 609.6 / 0.35 / 1e6\n    return base + scale * (base * pct * cruise_frac + level)\n\n\ndef build_problem(case: Case) -> tuple[Problem, pd.DataFrame]:\n    fl = case.flights.reset_index(drop=True)\n    sc = case.scenarios.reset_index(drop=True)\n    st, sup, fp = case.settings, case.supply, case.fuel\n    grades = grade_list(case)\n    n, B, R, S = len(fl), len(grades), len(ROUTES), len(sc)\n    if n == 0:\n        raise InputError(\"No departures in the case.\")\n    p = sc.probability.to_numpy(dtype=float)\n    if np.any(~np.isfinite(p)):\n        raise InputError(\"Every scenario needs a probability.\")\n    fuel = np.zeros((n, B, R, S))\n    con = np.zeros((n, B, R, S))\n    feas = np.ones((n, B, R, S), dtype=bool)\n    reasons, greasons = {}, {}\n    allowed = np.ones((n, B), dtype=bool)\n    q = np.zeros((n, B))\n    prem = np.zeros((n, B))\n    cash = np.zeros((n, B))\n    comp = np.zeros((n, B, R, S))\n    sburn = np.zeros((n, B, R, S))\n    loads = np.zeros((n, B))\n    ded = np.array([g.dedicated_delivery for g in grades])\n    detail = []\n    opt = case.options.set_index([\"study_id\", \"route\", \"scenario\"])\n    fuel_deadline = to_min(st[\"fuel_deadline_utc\"])\n    svc_start = np.array([to_min(t) - sup[\"service_offset_min\"] for t in fl.std_utc])\n    svc_end = svc_start + sup[\"service_minutes\"]\n\n    for i, f in fl.iterrows():\n        if f.uplift_kg < 0 or f.M0_kg < 0 or f.reserve_kg < 0:\n            raise InputError(f\"{f.study_id}: fuel quantities must be non-negative.\")\n        for b, g in enumerate(grades):\n            w_u = g.mass_fraction(fp)\n            if g.dedicated_delivery:\n                book_by = svc_start[i] - 60 * sup[\"booking_lead_h\"]\n                if not g.spec_compliant(fp):\n                    allowed[i, b] = False\n                    greasons[(i, b)] = (f\"{g.volume_fraction(fp):.1%} by volume exceeds the HEFA-SPK \"\n                                        f\"Annex A2 limit of {fp.hefa_a2_max_vol:.0%}\")\n                elif not bool(f.eligible_for_saf):\n                    allowed[i, b] = False\n                    greasons[(i, b)] = \"marked ineligible for the dedicated delivery\"\n                elif fuel_deadline > book_by + 1e-9:\n                    allowed[i, b] = False\n                    greasons[(i, b)] = (f\"supplier booking cutoff {from_min(book_by)} is before the \"\n                                        f\"fuel deadline {from_min(fuel_deadline)}\")\n            vol_L = f.uplift_kg / ph.blend_density(w_u, fp.rho_S, fp.rho_J) * 1000\n            loads[i, b] = math.ceil(vol_L / sup[\"truck_capacity_L\"] - 1e-9) if g.dedicated_delivery else 0\n            if g.dedicated_delivery and loads[i, b] > sup[\"trucks_per_window\"]:\n                allowed[i, b] = False\n                greasons[(i, b)] = (f\"needs {int(loads[i, b])} truck loads ({vol_L:,.0f} L) but only \"\n                                    f\"{sup['trucks_per_window']} trucks per window\")\n            for r, route in enumerate(ROUTES):\n                E = route_energy_MJ(f, route, fp, st[\"detour_energy_scale\"])\n                br = ph.burn(E, f.uplift_kg, w_u, fp, f.M0_kg, f.w0, g.dedicated_delivery)\n                cr = ph.costs(br, w_u, fp, sup[\"fee_eur\"] if g.dedicated_delivery else 0.0)\n                q[i, b] = br.q_stock_kg\n                prem[i, b] = cr.premium_eur if g.dedicated_delivery else 0.0\n                cash[i, b] = cr.cash_eur\n                level_ok = route == \"reference\" or bool(f[f\"{route}_allowed\"])\n                need = br.m_burn_kg + f.taxi_kg + f.reserve_kg\n                fuel_ok = need <= f.M0_kg + f.uplift_kg + 1e-6\n                tank_ok = f.M0_kg + f.uplift_kg <= f.tank_capacity_kg + 1e-6\n                for s, scen_name in enumerate(sc.scenario):\n                    key = (f.study_id, route, scen_name)\n                    ef0 = float(opt.loc[key, \"EF_ordinary_J\"]) if key in opt.index else 0.0\n                    ef = ph.blended_EF(ef0, br.w_onboard, st[\"response_scale\"], st[\"rel_change_at_ref\"])\n                    fuel[i, b, r, s] = br.L_fuel_t\n                    con[i, b, r, s] = ph.contrail_score_t(ef, fp)\n                    comp[i, b, r, s] = cr.comparison_eur\n                    sburn[i, b, r, s] = br.m_S_kg\n                    if not level_ok:\n                        feas[i, b, r, s] = False\n                        reasons[(i, b, r, s)] = level_reason(f, route)\n                    elif not fuel_ok:\n                        feas[i, b, r, s] = False\n                        reasons[(i, b, r, s)] = (f\"burn {br.m_burn_kg:,.0f} + taxi + reserve \"\n                                                 f\"{need:,.0f} kg exceeds fuel onboard {f.M0_kg + f.uplift_kg:,.0f} kg\")\n                    elif not tank_ok:\n                        feas[i, b, r, s] = False\n                        reasons[(i, b, r, s)] = \"fuel onboard exceeds declared tank capacity\"\n                    detail.append({\n                        \"study_id\": f.study_id, \"grade\": g.name, \"route\": route, \"scenario\": scen_name,\n                        \"uplift_kg\": f.uplift_kg, \"saf_mass_frac_delivered\": w_u,\n                        \"saf_vol_frac_delivered\": g.volume_fraction(fp), \"q_SAF_kg\": br.q_SAF_kg,\n                        \"q_stock_kg\": br.q_stock_kg, \"w_onboard\": br.w_onboard,\n                        \"route_energy_MJ\": E, \"H_mix_MJ_kg\": br.H_mix, \"m_burn_kg\": br.m_burn_kg,\n                        \"m_SAF_burn_kg\": br.m_S_kg, \"m_jet_burn_kg\": br.m_J_kg,\n                        \"remaining_kg\": br.remaining_kg, \"EF_ordinary_J\": ef0, \"EF_J\": ef,\n                        \"L_fuel_t\": br.L_fuel_t, \"L_contrail_t\": con[i, b, r, s],\n                        \"C_t\": br.L_fuel_t + con[i, b, r, s], \"cash_eur\": cr.cash_eur,\n                        \"comparison_eur\": cr.comparison_eur, \"premium_eur\": prem[i, b],\n                        \"truck_loads\": loads[i, b], \"feasible\": bool(feas[i, b, r, s] and allowed[i, b]),\n                        \"reason\": reasons.get((i, b, r, s), greasons.get((i, b), \"\")),\n                    })\n\n    base_groups = info_groups(st[\"info_mode\"], list(sc.scenario),\n                              list(sc.scenario[sc.pooled_in_partial.astype(bool)]))\n    vis = update_visibility(fl, st)\n    groups = np.tile(base_groups, (n, 1))\n    for i in range(n):\n        if not bool(vis.iloc[i].has_update) and case.kind == \"sourced\":\n            groups[i] = 0  # no newer cycle published before this flight's route cutoff\n    day_start, day_end = math.floor(svc_start.min() / 60) * 60, math.ceil(svc_end.max() / 60) * 60\n    wmin = sup[\"window_minutes\"]\n    windows = [SlotWindow(t, t + wmin, int(sup[\"trucks_per_window\"]), f\"{from_min(t)[7:12]}–{from_min(t + wmin)[7:12]}\")\n               for t in np.arange(day_start, day_end, wmin)]\n    receipts = []\n    if sup.get(\"receipt_kg\", 0) and sup.get(\"receipt_time_utc\"):\n        receipts = [(to_min(sup[\"receipt_time_utc\"]), float(sup[\"receipt_kg\"]))]\n    order = list(np.argsort(svc_start, kind=\"stable\"))\n    rep_name = st.get(\"representative\")\n    rep = list(sc.scenario).index(rep_name) if rep_name in list(sc.scenario) else int(np.argmax(p))\n    P = Problem(\n        flights=list(fl.study_id), grades=[g.name for g in grades], routes=ROUTES,\n        scenarios=list(sc.scenario), p=p, fuel=fuel, contrail=con, feasible=feas,\n        infeasible_reason=reasons, grade_allowed=allowed, grade_reason=greasons, groups=groups,\n        q_stock=q, dedicated=ded, premium_eur=prem, service_start_min=svc_start,\n        service_end_min=svc_end, truck_loads=loads, opening_stock_kg=float(sup[\"opening_stock_kg\"]),\n        receipts=receipts, slot_windows=windows, max_special=int(sup[\"max_special\"]),\n        cash_cap_eur=float(sup[\"cash_cap_eur\"]) if sup.get(\"cash_cap_enabled\") else None,\n        priority_order=order, preferred_grade=1, units=\"t CO2e\", representative=rep,\n        cash_eur=cash, comparison_eur=comp, saf_burn_kg=sburn,\n        meta={\"case\": case.name, \"kind\": case.kind, \"visibility\": vis},\n    )\n    return P, pd.DataFrame(detail)\n", "saf_app/strategies.py": "\"\"\"The five competing fuel-commitment strategies plus the ordinary-fuel reference.\n\nEvery strategy commits fuel first and then receives the *same* stage-two\nroute replanning, information groups, stock, slots, cash cap, feasibility\nlimits and prices. Grade index 0 is the ordinary/reference fuel.\n\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\n\nimport numpy as np\n\nfrom .model import Problem\nfrom .solver import SolveError, _route_policy, evaluate_commitment, resource_check, solve\n\nSTRATEGY_NAMES = [\n    \"Fixed priority\",\n    \"Original-route targeting\",\n    \"Route-first targeting\",\n    \"Joint deterministic\",\n    \"Joint stochastic\",\n]\nREFERENCE_NAME = \"Ordinary fuel, adaptive routes\"\n\n\n@dataclass\nclass StrategyResult:\n    name: str\n    x: np.ndarray\n    route: np.ndarray\n    per_flight: np.ndarray      # (n,S) reported score\n    scenario_scores: np.ndarray  # (S,)\n    expected: float\n    considered: str\n    notes: list = field(default_factory=list)\n    binding: dict = field(default_factory=dict)\n\n    def components(self, P: Problem):\n        n, B, R, S = P.shape\n        idx = (np.arange(n)[:, None], self.x[:, None], self.route, np.arange(S)[None, :])\n        fuel = (P.fuel[idx] * P.p[None, :]).sum()\n        con = (P.contrail[idx] * P.p[None, :]).sum()\n        ext = (P.extra[idx] * P.p[None, :]).sum()\n        return float(fuel), float(con), float(ext)\n\n    def saf_stock_kg(self, P: Problem) -> float:\n        return float(P.q_stock[np.arange(len(self.x)), self.x].sum())\n\n    def saf_burn_kg(self, P: Problem) -> float:\n        if P.saf_burn_kg is None:\n            return float(\"nan\")\n        n, B, R, S = P.shape\n        idx = (np.arange(n)[:, None], self.x[:, None], self.route, np.arange(S)[None, :])\n        return float((P.saf_burn_kg[idx] * P.p[None, :]).sum())\n\n    def cash_eur(self, P: Problem) -> float:\n        if P.cash_eur is None:\n            return float(\"nan\")\n        return float(P.cash_eur[np.arange(len(self.x)), self.x].sum())\n\n    def premium_eur(self, P: Problem) -> float:\n        return float(P.premium_eur[np.arange(len(self.x)), self.x].sum())\n\n    def comparison_eur(self, P: Problem) -> float:\n        if P.comparison_eur is None:\n            return float(\"nan\")\n        n, B, R, S = P.shape\n        idx = (np.arange(n)[:, None], self.x[:, None], self.route, np.arange(S)[None, :])\n        return float((P.comparison_eur[idx] * P.p[None, :]).sum())\n\n\ndef _finish(P, name, x, considered, w, notes=None, binding=None):\n    route, per, scen, exp = evaluate_commitment(P, x, w)\n    return StrategyResult(name, x, route, per, scen, exp, considered, notes or [], binding or {})\n\n\ndef _fallback_value(P, i, b, C_opt):\n    \"\"\"Best no-update route value when a fixed route is infeasible for (i,b).\"\"\"\n    n, B, R, S = P.shape\n    vals = [float(P.p @ C_opt[i, b, r]) for r in range(R) if P.feasible[i, b, r].all()]\n    return min(vals) if vals else None\n\n\ndef fixed_priority(P: Problem, w: float = 1.0) -> StrategyResult:\n    n, B, R, S = P.shape\n    x = np.zeros(n, dtype=int)\n    b_pref = P.preferred_grade\n    skipped = []\n    for i in P.priority_order:\n        trial = x.copy()\n        trial[i] = b_pref\n        if not P.grade_allowed[i, b_pref]:\n            skipped.append(f\"{P.flights[i]}: {P.grade_reason.get((i, b_pref), 'grade ineligible')}\")\n            continue\n        if resource_check(P, trial):\n            skipped.append(f\"{P.flights[i]}: {resource_check(P, trial)[0]}\")\n            continue\n        try:\n            _route_policy(P, trial, P.score(w))\n        except SolveError as e:\n            skipped.append(str(e))\n            continue\n        x = trial\n    order = \", \".join(P.flights[i] for i in P.priority_order)\n    return _finish(P, \"Fixed priority\", x,\n                   f\"Published order ({order}) filled with {P.grades[b_pref]} until a common \"\n                   \"limit binds. A simple proxy for a seasonal policy; no weather or route information.\",\n                   w, skipped)\n\n\ndef original_route_targeting(P: Problem, w: float = 1.0) -> StrategyResult:\n    n, B, R, S = P.shape\n    C = P.score(w)\n    V = np.zeros((n, B))\n    notes = []\n    for i in range(n):\n        for b in range(B):\n            if P.feasible[i, b, 0].all():\n                V[i, b] = float(P.p @ C[i, b, 0])\n            else:\n                fb = _fallback_value(P, i, b, C)\n                V[i, b] = fb if fb is not None else 1e9\n                notes.append(f\"{P.flights[i]} / {P.grades[b]}: planned route not feasible in every \"\n                             \"outcome; valued at best fixed alternative.\")\n    sol = solve(P, contrail_weight=w, x_values=V)\n    return _finish(P, \"Original-route targeting\", sol.x,\n                   \"Expected savings on the planned profiles only, through the same stock- and \"\n                   \"budget-constrained allocation solver.\", w, notes, sol.binding)\n\n\ndef route_first_targeting(P: Problem, w: float = 1.0) -> StrategyResult:\n    n, B, R, S = P.shape\n    C = P.score(w)\n    route0 = _route_policy(P, np.zeros(n, dtype=int), C)\n    V = np.zeros((n, B))\n    notes = []\n    for i in range(n):\n        for b in range(B):\n            ok = all(P.feasible[i, b, route0[i, s], s] for s in range(S))\n            if ok:\n                V[i, b] = float(sum(P.p[s] * C[i, b, route0[i, s], s] for s in range(S)))\n            else:\n                fb = _fallback_value(P, i, b, C)\n                V[i, b] = fb if fb is not None else 1e9\n                notes.append(f\"{P.flights[i]} / {P.grades[b]}: ordinary-fuel route infeasible; \"\n                             \"valued at best fixed alternative.\")\n    sol = solve(P, contrail_weight=w, x_values=V)\n    return _finish(P, \"Route-first targeting\", sol.x,\n                   \"Adaptive routes planned with ordinary fuel first; SAF then allocated by benefit \"\n                   \"on those fixed routes. Replanning is allowed after fuel commitment.\", w, notes,\n                   sol.binding)\n\n\ndef joint_deterministic(P: Problem, w: float = 1.0) -> StrategyResult:\n    rep = P.representative\n    sol = solve(P, contrail_weight=w, scenario_subset=[rep])\n    return _finish(P, \"Joint deterministic\", sol.x,\n                   f\"Fuel and routes chosen together for one representative scenario \"\n                   f\"('{P.scenarios[rep]}'); fuel decision frozen, then evaluated with the same \"\n                   \"forecast-based route policy.\", w, [], sol.binding)\n\n\ndef joint_stochastic(P: Problem, w: float = 1.0, cvar_weight: float = 0.0) -> StrategyResult:\n    sol = solve(P, contrail_weight=w, cvar_weight=cvar_weight)\n    extra = f\" Risk weight on worst-5% CVaR = {cvar_weight:g}.\" if cvar_weight else \"\"\n    return _finish(P, \"Joint stochastic\", sol.x,\n                   \"Fuel chosen while accounting for every scenario's probability and the route \"\n                   \"choices available under each later forecast signal.\" + extra, w, [], sol.binding)\n\n\ndef ordinary_reference(P: Problem, w: float = 1.0) -> StrategyResult:\n    n = len(P.flights)\n    return _finish(P, REFERENCE_NAME, np.zeros(n, dtype=int),\n                   \"No SAF; routes adapt to the forecast signal.\", w)\n\n\ndef run_all(P: Problem, w: float = 1.0, cvar_weight: float = 0.0) -> dict[str, StrategyResult]:\n    out = {\n        \"Fixed priority\": fixed_priority(P, w),\n        \"
